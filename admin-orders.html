<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pitaara admin | Orders</title>
<link rel="stylesheet" href="app.css">
<style>.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tabs .on{background:var(--fg);color:var(--bg)}h2{margin-top:20px}</style>
</head>
<body>
<div class="wrap">
<h1>PITAARA ADMIN</h1>
<p class="mut"><a href="admin.html">Products</a> &nbsp;|&nbsp; <b>Orders aur settings</b></p>
<div id="m" role="status"></div>

<div id="out"><p class="mut">Login karo. Sirf approved Gmail se hi chalega.</p><button id="in">Google se login</button></div>

<div id="app" hidden>
<div class="row"><span class="mut" id="who"></span><button class="alt sm" id="exit">Logout</button></div>
<div class="tabs">
<button class="alt on" data-t="s1">Orders</button>
<button class="alt" data-t="s3">Customers</button>
<button class="alt" data-t="s4">Report</button>
<button class="alt" data-t="s2">Settings</button>
</div>

<section id="s1">
<p class="mut" id="sumr"></p>
<div class="acts" style="margin:0 0 8px">
<select id="flt" aria-label="Filter" style="flex:1">
<option value="open">Chalu orders</option>
<option value="new">Naye</option>
<option value="delivered">Delivered</option>
<option value="cancelled">Cancelled</option>
<option value="all">Sab</option>
</select>
<button class="alt sm" id="csv">CSV download</button>
</div>
<div id="list"></div>
</section>

<section id="s3" hidden><div id="cust"></div></section>

<section id="s4" hidden>
<select id="rng" aria-label="Time range">
<option value="today">Aaj</option>
<option value="7">Pichle 7 din</option>
<option value="30">Pichle 30 din</option>
<option value="all">Sab</option>
</select>
<div id="rep"></div>
</section>

<section id="s2" hidden>
<form id="sf">
<h2>Delivery aur payment</h2>
<label for="su">UPI ID (jaise name@upi)</label><input id="su" type="text" autocapitalize="off">
<label for="sd">Delivery charge (rupaye)</label><input id="sd" type="number" min="0" step="any">
<label for="sa">Is amount ke upar delivery free (rupaye)</label><input id="sa" type="number" min="0" step="any">
<label for="sm">Minimum order (rupaye, 0 = koi limit nahi)</label><input id="sm" type="number" min="0" step="any">
<label for="sp">Delivery wale pincodes (comma se alag, khaali = sab jagah)</label><input id="sp" type="text" inputmode="numeric" placeholder="110001, 110002">
<label for="ss">Time slots (comma se alag, khaali = slot nahi)</label><input id="ss" type="text" placeholder="10am-1pm, 4pm-8pm">
<label class="chk"><input id="so" type="checkbox" checked> Dukaan abhi khuli hai (orders le rahi hai)</label>

<h2>Dukaan ka look</h2>
<label for="th">Theme (rang)</label><select id="th"></select>
<label for="tg">Header tagline (jaise Same-day delivery)</label><input id="tg" type="text">
<label for="ht">Home banner ka heading</label><input id="ht" type="text" placeholder="Diwali Gift Store">
<label for="hs">Banner ki chhoti line</label><input id="hs" type="text">
<label for="hbn">Banner ke button ka text</label><input id="hbn" type="text" placeholder="Shop now">
<label for="sb">Offer patti (sabse upar, khaali = nahi)</label><input id="sb" type="text">
<label for="fo">Neeche ki line</label><input id="fo" type="text" placeholder="Wishing you a bright, sweet Diwali">
<label class="chk"><input id="fe" type="checkbox" checked> Festive look (toran aur girti patti)</label>

<h2>Coupons</h2>
<div id="cl"></div>
<div class="card">
<label for="cc">Code (jaise DIWALI10)</label><input id="cc" type="text" autocapitalize="characters">
<label for="cy">Type</label><select id="cy"><option value="percent">Percent off (%)</option><option value="flat">Seedha rupaye off</option></select>
<label for="cv">Value</label><input id="cv" type="number" min="0" step="any">
<label for="cm">Minimum order (rupaye, optional)</label><input id="cm" type="number" min="0" step="any">
<button type="button" class="alt" id="ca">Coupon jodo</button>
</div>
<p class="mut">Coupon ya kuch bhi badalne ke baad neeche "Save karo" zaroor dabao.</p>
<button type="submit">Save karo</button>
</form>
</section>
</div>
</div>

<script type="module">
import { SHOP, firebaseConfig } from "./config.js";
import { THEMES } from "./theme.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, setDoc, updateDoc, doc, onSnapshot, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const rs = n => "\u20B9" + Number(n || 0).toLocaleString("en-IN");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = [["new", "Naya"], ["confirmed", "Confirmed"], ["packed", "Packed"], ["out", "Delivery pe nikla"], ["delivered", "Delivered"], ["cancelled", "Cancelled"]];
let orders = [], prods = {}, first = true, started = false, coupons = [];
$("th").innerHTML = Object.entries(THEMES).map(([k, t]) => '<option value="' + k + '">' + esc(t.name) + '</option>').join("");

function msg(t) { const m = $("m"); m.textContent = t; m.style.display = "block"; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = "none", 4500); }
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(c.currentTime + 0.3);
  } catch (e) {}
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
}
const when = t => new Date(t).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });

/* ---------- orders ---------- */
function draw() {
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const today = orders.filter(o => o.createdAt >= day.getTime() && o.status !== "cancelled");
  $("sumr").textContent = "Aaj: " + today.length + " orders, " + rs(today.reduce((a, o) => a + (o.total || 0), 0)) + " | Naye: " + orders.filter(o => o.status === "new").length;
  const f = $("flt").value;
  const list = orders.filter(o => f === "all" ? true : f === "open" ? ["new", "confirmed", "packed", "out"].includes(o.status) : o.status === f);
  $("list").innerHTML = list.length ? list.map(o => {
    const items = o.items || [], sum = items.reduce((a, i) => a + i.price * i.qty, 0);
    const bad = sum - (o.discount || 0) + (o.delivery || 0) !== o.total || items.some(i => i.id && prods[i.id] && Number(prods[i.id].price) !== i.price);
    return '<div class="card"><div class="row" style="border:0;padding:0"><b>#' + esc(o.id.slice(0, 6).toUpperCase()) + '</b><span class="mut">' + when(o.createdAt) + '</span></div>' +
      '<p>' + esc(o.name) + ' | <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a> | <a href="https://wa.me/91' + esc(o.phone) + '" target="_blank" rel="noopener">WhatsApp</a></p>' +
      '<p class="mut">' + esc(o.address) + (o.landmark ? ", " + esc(o.landmark) : "") + ", " + esc(o.pincode) + '</p>' +
      (o.slot ? '<p>Delivery: <b>' + esc(o.slot) + '</b></p>' : "") +
      '<ul>' + items.map(i => '<li>' + esc(i.name) + ' x ' + esc(i.qty) + ' (' + rs(i.price) + ')</li>').join("") + '</ul>' +
      (o.discount ? '<div class="row"><span>Coupon ' + esc(o.coupon) + '</span><span>- ' + rs(o.discount) + '</span></div>' : "") +
      '<div class="row"><span>Delivery ' + (o.delivery ? rs(o.delivery) : "free") + '</span><b>Total ' + rs(o.total) + '</b></div>' +
      '<p>' + (o.payment === "upi" ? "UPI, UTR: " + esc(o.utr) : "Cash on Delivery") + ' <span class="badge">' + (o.paid ? "Paid" : "Baaki") + '</span></p>' +
      (bad ? '<p class="mut"><b>Dhyan:</b> daam ya total abhi ke daam se match nahi karte, check karke confirm karo.</p>' : "") +
      '<div class="acts"><select data-s="' + o.id + '" aria-label="Status">' + STATUS.map(s => '<option value="' + s[0] + '"' + (o.status === s[0] ? " selected" : "") + '>' + s[1] + '</option>').join("") + '</select>' +
      '<button class="alt sm" data-p="' + o.id + '">' + (o.paid ? "Paid hata do" : "Paid mark karo") + '</button>' +
      '<button class="alt sm" data-b="' + o.id + '">Bill print</button></div></div>';
  }).join("") : '<p class="mut">Is filter me koi order nahi hai.</p>';
}

async function adjust(o, sign) {
  for (const i of o.items || []) {
    const p = prods[i.id];
    if (i.id && p && p.stock != null) {
      await updateDoc(doc(db, "products", i.id), { stock: increment(sign * i.qty) });
      p.stock += sign * i.qty;
    }
  }
}
async function setStatus(o, st) {
  const cut = st !== "new" && st !== "cancelled", upd = { status: st };
  if (cut && !o.stockCut) { await adjust(o, -1); upd.stockCut = true; }
  if (!cut && o.stockCut) { await adjust(o, 1); upd.stockCut = false; }
  await updateDoc(doc(db, "orders", o.id), upd);
}

function bill(o) {
  const w = window.open("", "_blank");
  if (!w) return msg("Popup block hai. Allow karke dobara try karo.");
  const rows = (o.items || []).map(i => "<tr><td>" + esc(i.name) + "</td><td>" + esc(i.qty) + "</td><td>" + rs(i.price) + "</td><td>" + rs(i.price * i.qty) + "</td></tr>").join("");
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bill ' + esc(o.id.slice(0, 6).toUpperCase()) + '</title><style>body{font-family:system-ui,sans-serif;padding:20px;max-width:560px;margin:auto;color:#111}h1{margin:0;letter-spacing:.2em;font-size:22px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}table{width:100%;border-collapse:collapse}.r{text-align:right}p{margin:4px 0}</style></head><body>' +
    "<h1>" + esc(SHOP.toUpperCase()) + "</h1><p>Delhi</p><hr><p><b>Bill #" + esc(o.id.slice(0, 6).toUpperCase()) + "</b> | " + when(o.createdAt) + "</p>" +
    "<p>" + esc(o.name) + " | " + esc(o.phone) + "</p><p>" + esc(o.address) + (o.landmark ? ", " + esc(o.landmark) : "") + ", " + esc(o.pincode) + "</p>" +
    (o.slot ? "<p>Delivery: " + esc(o.slot) + "</p>" : "") +
    "<table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>" + rows + "</table>" +
    '<p class="r">Subtotal: ' + rs(o.subtotal) + "</p>" + (o.discount ? '<p class="r">Coupon ' + esc(o.coupon) + ": - " + rs(o.discount) + "</p>" : "") +
    '<p class="r">Delivery: ' + (o.delivery ? rs(o.delivery) : "Free") + '</p><p class="r"><b>Total: ' + rs(o.total) + "</b></p>" +
    "<p>Payment: " + (o.payment === "upi" ? "UPI" : "Cash on Delivery") + " (" + (o.paid ? "Paid" : "Baaki") + ")</p><p>Shukriya!</p></body></html>");
  w.document.close();
  setTimeout(() => w.print(), 400);
}

function csvOut() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const head = ["Order", "Date", "Name", "Phone", "Address", "Pincode", "Items", "Subtotal", "Discount", "Delivery", "Total", "Payment", "Paid", "Status", "Slot"];
  const rows = orders.map(o => [o.id.slice(0, 6).toUpperCase(), new Date(o.createdAt).toLocaleString("en-IN"), o.name, o.phone, (o.address || "") + (o.landmark ? ", " + o.landmark : ""), o.pincode,
    (o.items || []).map(i => i.name + " x" + i.qty).join("; "), o.subtotal, o.discount || 0, o.delivery || 0, o.total, o.payment, o.paid ? "yes" : "no", o.status, o.slot || ""].map(q).join(","));
  download("pitaara-orders.csv", [head.map(q).join(",")].concat(rows).join("\n"), "text/csv");
}

/* ---------- customers and report ---------- */
function drawCust() {
  const m = new Map();
  orders.forEach(o => {
    const k = o.uid || o.phone, c = m.get(k) || { name: o.name, phone: o.phone, n: 0, sum: 0, last: 0 };
    if (o.status !== "cancelled") { c.n++; c.sum += o.total || 0; }
    c.last = Math.max(c.last, o.createdAt); m.set(k, c);
  });
  const list = [...m.values()].sort((a, b) => b.sum - a.sum);
  $("cust").innerHTML = '<p class="mut">' + list.length + ' customers</p>' + (list.length ? list.map(c =>
    '<div class="row"><div><b>' + esc(c.name) + '</b><div class="mut"><a href="tel:' + esc(c.phone) + '">' + esc(c.phone) + '</a> | <a href="https://wa.me/91' + esc(c.phone) + '" target="_blank" rel="noopener">WhatsApp</a></div>' +
    '<div class="mut">Last order: ' + when(c.last) + '</div></div><div style="text-align:right"><b>' + rs(c.sum) + '</b><div class="mut">' + c.n + ' orders</div></div></div>').join("") : "");
}
function drawRep() {
  const r = $("rng").value, day = new Date(); day.setHours(0, 0, 0, 0);
  const from = r === "today" ? day.getTime() : r === "7" ? Date.now() - 7 * 864e5 : r === "30" ? Date.now() - 30 * 864e5 : 0;
  const os = orders.filter(o => o.createdAt >= from && o.status !== "cancelled");
  const rev = os.reduce((a, o) => a + (o.total || 0), 0), unpaid = os.filter(o => !o.paid).reduce((a, o) => a + (o.total || 0), 0);
  const cnt = {}; os.forEach(o => (o.items || []).forEach(i => { cnt[i.name] = (cnt[i.name] || 0) + i.qty; }));
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const row = (a, b) => '<div class="row"><span>' + a + '</span><b>' + b + '</b></div>';
  $("rep").innerHTML = row("Orders", os.length) + row("Sales", rs(rev)) + row("Average order", rs(os.length ? Math.round(rev / os.length) : 0)) +
    row("Cash on Delivery", os.filter(o => o.payment !== "upi").length) + row("UPI", os.filter(o => o.payment === "upi").length) +
    row("Payment baaki", rs(unpaid)) + row("Delivered", os.filter(o => o.status === "delivered").length) +
    "<h2>Sabse zyada bikne wale</h2>" + (top.length ? top.map(t => row(esc(t[0]), t[1] + " piece")).join("") : '<p class="mut">Abhi data nahi hai.</p>');
}

/* ---------- coupons ---------- */
function renderCoupons() {
  $("cl").innerHTML = coupons.length ? coupons.map((c, k) =>
    '<div class="row"><div><b>' + esc(c.code) + '</b><div class="mut">' + (c.type === "percent" ? c.value + "% off" : rs(c.value) + " off") + (c.min ? ", min " + rs(c.min) : "") + (c.active ? "" : ", band") + '</div></div>' +
    '<div class="acts" style="margin:0"><button type="button" class="alt sm" data-a="tog" data-k="' + k + '">' + (c.active ? "Band karo" : "Chalu karo") + '</button><button type="button" class="alt sm" data-a="del" data-k="' + k + '">Delete</button></div></div>'
  ).join("") : '<p class="mut">Abhi koi coupon nahi hai.</p>';
}
$("cl").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const k = Number(b.dataset.k);
  if (b.dataset.a === "del") coupons.splice(k, 1); else coupons[k].active = !coupons[k].active;
  renderCoupons();
};
$("ca").onclick = () => {
  const code = $("cc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ""), v = Number($("cv").value), type = $("cy").value;
  if (!code || !(v > 0) || (type === "percent" && v > 100)) return msg("Code aur sahi value daalo (percent 100 se zyada nahi).");
  coupons = coupons.filter(c => c.code !== code).concat([{ code, type, value: v, min: Number($("cm").value) || 0, active: true }]);
  $("cc").value = ""; $("cv").value = ""; $("cm").value = "";
  renderCoupons(); msg("Coupon jud gaya. Neeche Save karo dabao.");
};

/* ---------- start ---------- */
function start() {
  if (started) return; started = true;
  getDocs(collection(db, "products")).then(s => { s.forEach(d => prods[d.id] = d.data()); draw(); }).catch(() => {});
  onSnapshot(collection(db, "orders"), snap => {
    if (!first) snap.docChanges().forEach(c => { if (c.type === "added") { beep(); msg("Naya order aaya!"); } });
    first = false;
    orders = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    draw();
  }, () => msg("Orders load nahi hue. Aapka Gmail approved list me nahi hai."));
  getDoc(doc(db, "settings", "store")).then(s => {
    const c = s.exists() ? s.data() : {};
    $("su").value = c.upiId || ""; $("sd").value = c.deliveryCharge ?? 30; $("sa").value = c.freeAbove ?? 500; $("sm").value = c.minOrder ?? 0;
    $("sp").value = (c.deliveryPins || []).join(", "); $("ss").value = (c.slots || []).join(", "); $("so").checked = c.shopOpen !== false;
    $("th").value = c.theme || "diwali"; $("tg").value = c.tagline || ""; $("ht").value = c.heroTitle || ""; $("hs").value = c.heroSub || "";
    $("hbn").value = c.heroBtn || ""; $("sb").value = c.bannerText || ""; $("fo").value = c.footer || ""; $("fe").checked = c.festive !== false;
    coupons = c.coupons || []; renderCoupons();
  }).catch(() => {});
}

document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-t]").forEach(x => { x.classList.toggle("on", x === b); $(x.dataset.t).hidden = x !== b; });
  if (b.dataset.t === "s3") drawCust();
  if (b.dataset.t === "s4") drawRep();
});
$("rng").onchange = drawRep;
$("flt").onchange = draw;
$("csv").onclick = csvOut;

$("list").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.b) { const o = orders.find(x => x.id === b.dataset.b); if (o) bill(o); return; }
  const o = orders.find(x => x.id === b.dataset.p); if (!o) return;
  try { await updateDoc(doc(db, "orders", o.id), { paid: !o.paid }); } catch (x) { msg("Update nahi hua."); }
};
$("list").onchange = async e => {
  const s = e.target.closest("select[data-s]"); if (!s) return;
  try { const o = orders.find(x => x.id === s.dataset.s); await setStatus(o, s.value); msg("Status badal gaya"); } catch (x) { msg("Update nahi hua."); }
};

$("sf").onsubmit = async e => {
  e.preventDefault();
  try {
    await setDoc(doc(db, "settings", "store"), {
      upiId: $("su").value.trim(), deliveryCharge: Number($("sd").value) || 0, freeAbove: Number($("sa").value) || 0, minOrder: Number($("sm").value) || 0,
      deliveryPins: $("sp").value.split(/[,\s]+/).filter(x => /^\d{6}$/.test(x)), slots: $("ss").value.split(",").map(x => x.trim()).filter(Boolean),
      shopOpen: $("so").checked, theme: $("th").value, tagline: $("tg").value.trim(), heroTitle: $("ht").value.trim(), heroSub: $("hs").value.trim(),
      heroBtn: $("hbn").value.trim(), bannerText: $("sb").value.trim(), footer: $("fo").value.trim(), festive: $("fe").checked, coupons
    }, { merge: true });
    msg("Settings save ho gayi");
  } catch (x) { msg("Save nahi hua. Sirf main admin Gmail settings badal sakta hai."); }
};

$("in").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(() => msg("Login nahi hua. Dobara try karo."));
$("exit").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  $("out").hidden = !!u; $("app").hidden = !u;
  if (u) { $("who").textContent = u.email; start(); }
});
renderCoupons();
</script>
</body>
</html>
