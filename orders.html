<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mere orders | Pitaara</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
<a href="index.html" class="mut">&larr; Dukaan pe wapas</a>
<h1>MERE ORDERS</h1>
<div id="m" role="status"></div>

<div id="login" hidden><p>Apne orders dekhne ke liye login karo.</p><button id="in">Google se login</button></div>

<div id="app" hidden>
<div class="row"><span class="mut" id="who"></span><button class="alt sm" id="exit">Logout</button></div>
<div id="list"></div>
</div>
</div>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const rs = n => "\u20B9" + Number(n).toLocaleString("en-IN");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ST = { new: "Naya, confirm hone ka intezaar", confirmed: "Confirm ho gaya", packed: "Pack ho raha hai", out: "Delivery ke liye nikla", delivered: "Delivered", cancelled: "Cancel" };
let orders = [];

function msg(t) { const m = $("m"); m.textContent = t; m.style.display = "block"; clearTimeout(msg.t); msg.t = setTimeout(() => m.style.display = "none", 4500); }

function payText(o) {
  if (o.payment === "upi") return o.paid ? "UPI, payment mil gaya" : "UPI, payment verify ho raha hai";
  return o.paid ? "Cash on Delivery, payment mil gaya" : "Cash on Delivery";
}

function draw() {
  $("list").innerHTML = orders.length ? orders.map(o =>
    '<div class="card"><div class="row" style="border:0;padding:0"><b>#' + esc(o.id.slice(0, 6).toUpperCase()) + '</b><span class="mut">' + new Date(o.createdAt).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) + '</span></div>' +
    '<p><span class="badge">' + esc(ST[o.status] || o.status) + '</span></p>' +
    '<ul>' + (o.items || []).map(i => '<li>' + esc(i.name) + ' x ' + esc(i.qty) + '</li>').join("") + '</ul>' +
    '<div class="row"><span>Total</span><b>' + rs(o.total) + '</b></div>' +
    '<p class="mut">' + esc(payText(o)) + '</p>' +
    '<button class="alt sm" data-id="' + o.id + '">Dobara order karo</button></div>'
  ).join("") : '<p class="mut">Abhi koi order nahi hai.</p><a class="btn" href="index.html">Dukaan pe jao</a>';
}

async function load(u) {
  try {
    const s = await getDocs(query(collection(db, "orders"), where("uid", "==", u.uid)));
    orders = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt);
    draw();
  } catch (e) { msg("Orders load nahi hue. Thodi der baad try karo."); }
}

$("list").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const o = orders.find(x => x.id === b.dataset.id); if (!o) return;
  try { localStorage.setItem("pitaara_cart", JSON.stringify(o.items.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })))); } catch (x) {}
  location.href = "index.html";
};

$("in").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(() => msg("Login nahi hua. Dobara try karo."));
$("exit").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  $("login").hidden = !!u; $("app").hidden = !u;
  if (u) { $("who").textContent = u.email; load(u); }
});
</script>
</body>
</html>
